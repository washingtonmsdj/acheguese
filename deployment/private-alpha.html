<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Achegue-se | Alpha privada</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #04131a;
        color: #f3f7f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #04131a;
      }

      main {
        width: min(34rem, calc(100% - 2rem));
        padding: 2rem 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .mark {
        width: 1.1rem;
        height: 1.1rem;
        border: 0.2rem solid #13d9ce;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
      }

      .mark::after {
        content: "";
        display: block;
        width: 0.25rem;
        height: 0.25rem;
        margin: 0.22rem;
        border-radius: 50%;
        background: #13d9ce;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        max-width: 31rem;
        margin: 0;
        color: #b7c7cc;
        font-size: 1rem;
        line-height: 1.65;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
        color: #83e8e1;
        font-size: 0.875rem;
      }

      .status::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #13d9ce;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>Achegue-se
      </div>
      <h1>Alpha privada em preparação</h1>
      <p>
        O ambiente está fechado para validação técnica com um grupo controlado
        de participantes. O acesso será liberado individualmente para as pessoas
        convidadas.
      </p>
      <div class="status">Acesso público ainda não disponível</div>
    </main>
  </body>
</html>
