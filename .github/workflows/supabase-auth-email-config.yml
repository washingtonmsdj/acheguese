name: Supabase Auth Email Config

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-auth-email-config.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-auth-email-config-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: "xhdowzacfujckjelqhtd"
  AUTH_CONFIG_URL: "https://api.supabase.com/v1/projects/xhdowzacfujckjelqhtd/config/auth"
  AUTH_EMAIL_FROM: "no-reply@acheguese.com.br"
  AUTH_EMAIL_SENDER_NAME: "Achegue-se"
  AUTH_CONFIRMATION_SUBJECT: "Confirme seu e-mail | Achegue-se"

jobs:
  configure-auth-email:
    name: Configure production auth email identity
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Validate production target and credential presence
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            throw "Unexpected repository: $env:GITHUB_REPOSITORY"
          }
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Only refs/heads/main is authorized. Received: $env:GITHUB_REF"
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            throw "GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing."
          }
          if ($env:SUPABASE_PROJECT_REF -ne "xhdowzacfujckjelqhtd") {
            throw "Unexpected Supabase project ref."
          }
          Write-Host "Production target and credential presence validated."

      - name: Inspect current Auth SMTP transport without exposing secrets
        id: before
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN"
            Accept = "application/json"
          }
          $current = Invoke-RestMethod -Uri $env:AUTH_CONFIG_URL -Headers $headers -Method Get
          $smtpHost = [string]$current.smtp_host
          $currentSender = [string]$current.smtp_admin_email

          if ([string]::IsNullOrWhiteSpace($smtpHost)) {
            throw "Custom SMTP is not configured on the production Auth project."
          }
          if (-not $smtpHost.ToLowerInvariant().Contains("resend")) {
            throw "Production SMTP host is not Resend; refusing to rewrite sender identity."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "smtp_transport=resend" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sender_already_current=$($currentSender -eq $env:AUTH_EMAIL_FROM)" -Encoding UTF8
          Write-Host "Resend SMTP transport confirmed. No SMTP secret was printed."

      - name: Apply Achegue-se sender identity and confirmation template
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN"
            Accept = "application/json"
          }
          $payload = [ordered]@{
            smtp_admin_email = $env:AUTH_EMAIL_FROM
            smtp_sender_name = $env:AUTH_EMAIL_SENDER_NAME
            mailer_subjects_confirmation = $env:AUTH_CONFIRMATION_SUBJECT
            mailer_templates_confirmation_content = '<h2>Confirme seu e-mail</h2><p>Para concluir seu cadastro no Achegue-se, confirme seu endereço de e-mail.</p><p><a href="{{ .ConfirmationURL }}">Confirmar meu e-mail</a></p><p>Se você não criou esta conta, pode ignorar esta mensagem.</p>'
          } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Uri $env:AUTH_CONFIG_URL `
            -Headers $headers `
            -Method Patch `
            -ContentType "application/json" `
            -Body $payload | Out-Null

          Write-Host "Auth email identity patch accepted by Supabase."

      - name: Verify applied Auth email identity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:SUPABASE_ACCESS_TOKEN"
            Accept = "application/json"
          }
          $actual = Invoke-RestMethod -Uri $env:AUTH_CONFIG_URL -Headers $headers -Method Get

          if ([string]$actual.smtp_admin_email -ne $env:AUTH_EMAIL_FROM) {
            throw "Auth sender verification failed."
          }
          if ([string]$actual.smtp_sender_name -ne $env:AUTH_EMAIL_SENDER_NAME) {
            throw "Auth sender name verification failed."
          }
          if ([string]$actual.mailer_subjects_confirmation -ne $env:AUTH_CONFIRMATION_SUBJECT) {
            throw "Confirmation subject verification failed."
          }

          Write-Host "Auth email sender and confirmation template verified on the production project."

      - name: Record non-secret summary
        if: always()
        shell: powershell
        run: |
          @(
            "## Supabase Auth email configuration",
            "- Repository: washingtonmsdj/acheguese",
            "- Branch: main",
            "- Project ref: $env:SUPABASE_PROJECT_REF",
            "- SMTP transport expected: Resend",
            "- Sender: $env:AUTH_EMAIL_FROM",
            "- Sender name: $env:AUTH_EMAIL_SENDER_NAME",
            "- Confirmation subject: $env:AUTH_CONFIRMATION_SUBJECT",
            "- SMTP host/user/password are read-only and are not written or printed by this workflow.",
            "- Resend domain verification remains an independent DNS prerequisite."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
