name: Security Check

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "tools/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".eslintrc*.json"
      - ".gitignore"
      - ".github/workflows/security-check.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "tools/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".eslintrc*.json"
      - ".gitignore"
      - ".github/workflows/security-check.yml"
  workflow_dispatch:

concurrency:
  group: security-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security-validation:
    name: Validate No Hardcoded Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security validation
        run: npm run security:validate

      - name: Check for .env.local in commits
        run: |
          tracked_env_local="$(git ls-files | grep -E '(^|/)\.env(\.[^.]+)?\.local$' || true)"
          if [ -n "$tracked_env_local" ]; then
            echo "❌ Error: .env.local file found in repository!"
            echo "This file should be in .gitignore and never committed."
            echo "$tracked_env_local"
            exit 1
          fi
          echo "✅ No .env.local file found in repository"

      - name: Validate .gitignore
        run: |
          if ! grep -q "\.env\.local" .gitignore; then
            echo "❌ Error: .env.local not found in .gitignore!"
            exit 1
          fi
          echo "✅ .env.local is properly ignored"

  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Validate Upload SSOT Boundaries
        run: npm run validate:upload:ssot

      - name: Run Media SSOT Unit Tests
        run: npm run test:media:ssot

      - name: Run architecture boundaries incremental validation
        run: npm run validate:architecture:incremental

      - name: Validate Core Platform ownership
        run: npm run validate:architecture:core-platform

  maps-architecture-enforcement:
    name: Maps Architecture Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Maps Architecture
        run: npm run validate:maps

      - name: Lint Maps Boundaries
        run: npm run lint:maps

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
