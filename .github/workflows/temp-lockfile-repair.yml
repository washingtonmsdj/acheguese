name: Temporary Lockfile Repair

on:
  push:
    branches:
      - test/active-visual-import-graph-ssot

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependency tree
        run: npm ci

      - name: Apply compatible audit fixes to lockfile only
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only
          fix_exit=$?
          set -e
          echo "npm audit fix exit code: ${fix_exit} (non-zero is expected when only breaking fixes remain)"

      - name: Verify source-map-js compatible fix landed
        run: |
          node -e "const p=require('./package-lock.json'); const v=p.packages?.['node_modules/source-map-js']?.version; if(v!=='1.2.2'){throw new Error('expected source-map-js 1.2.2, got '+v)}; console.log('source-map-js',v)"

      - name: Verify production tree remains clean
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already contains the compatible fixes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          HUSKY=0 git commit --no-verify -m "chore(deps): apply compatible npm audit fixes"
          git push origin HEAD:test/active-visual-import-graph-ssot
