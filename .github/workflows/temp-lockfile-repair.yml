name: Temporary Lockfile Repair

on:
  push:
    branches:
      - test/active-visual-import-graph-ssot

permissions:
  contents: read

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependency tree
        run: npm ci

      - name: Apply compatible audit fixes to lockfile only
        run: npm audit fix --package-lock-only

      - name: Capture full-tree audit after compatible fixes
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-after-fix.json
          echo "audit_exit=$?"
          set -e

      - name: Verify production tree remains clean
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload generated lockfile and audit
        uses: actions/upload-artifact@v7
        with:
          name: lockfile-repair-output
          path: |
            package-lock.json
            npm-audit-after-fix.json
          retention-days: 1
