name: Supabase Types Sync

# G5 bootstrap: workflow-file changes intentionally trigger live type reconciliation.
# 2026-09-16: explicit reconciliation touch after Mobility RPC signature cutover.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-types-sync.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "tools/supabase/generate-supabase-types.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: supabase-types-sync-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_PROJECT_ID: "xhdowzacfujckjelqhtd"
  SUPABASE_POOLER_HOST: "aws-0-sa-east-1.pooler.supabase.com"
  TYPES_PATH: "src/integrations/supabase/types.generated.ts"
  SYNC_BRANCH: "automation/supabase-types-sync"

jobs:
  sync-types:
    name: Regenerate canonical database types
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Assert main-only execution and provider credentials
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            throw "Unexpected repository: $env:GITHUB_REPOSITORY"
          }
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Only refs/heads/main is authorized. Received $env:GITHUB_REF"
          }

          $hasAccessToken = -not [string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)
          $hasDbPassword = -not [string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)
          if (-not $hasAccessToken -and -not $hasDbPassword) {
            throw "Neither SUPABASE_ACCESS_TOKEN nor SUPABASE_DB_PASSWORD is configured."
          }
          if ($hasDbPassword) {
            Write-Output "::add-mask::$($env:SUPABASE_DB_PASSWORD)"
          }

      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Setup canonical Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regenerate types from live Supabase schema
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $hasAccessToken = -not [string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)
          if (-not $hasAccessToken) {
            if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) {
              throw "SUPABASE_DB_PASSWORD is required when SUPABASE_ACCESS_TOKEN is unavailable."
            }

            $encodedPassword = [System.Uri]::EscapeDataString($env:SUPABASE_DB_PASSWORD)
            $projectRef = $env:VITE_SUPABASE_PROJECT_ID
            $poolerHost = $env:SUPABASE_POOLER_HOST
            $dbUrl = "postgresql://postgres.$projectRef`:$encodedPassword@$poolerHost`:5432/postgres?sslmode=require"
            Write-Output "::add-mask::$dbUrl"
            $env:SUPABASE_DB_URL = $dbUrl
            Write-Host "SUPABASE_ACCESS_TOKEN unavailable; using canonical Supabase DB URL type-generation fallback."
          }

          npm run generate:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path -LiteralPath $env:TYPES_PATH)) {
            throw "Canonical Supabase type generator did not create $env:TYPES_PATH."
          }

          $text = [System.IO.File]::ReadAllText($env:TYPES_PATH)
          if ([string]::IsNullOrWhiteSpace($text) -or $text -notmatch "export type Database") {
            throw "Canonical Supabase type generator returned an invalid artifact."
          }

          $typesTempPath = Join-Path $env:RUNNER_TEMP "acheguese-supabase-types.generated.ts"
          $generatedBytes = [System.IO.File]::ReadAllBytes($env:TYPES_PATH)
          [System.IO.File]::WriteAllBytes($typesTempPath, $generatedBytes)

      - name: Publish generated types through pull request
        shell: powershell
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $typesTempPath = Join-Path $env:RUNNER_TEMP "acheguese-supabase-types.generated.ts"
          if (-not (Test-Path -LiteralPath $typesTempPath)) {
            throw "Generated Supabase types artifact is missing from RUNNER_TEMP."
          }

          function Invoke-GitHubApi {
            param(
              [Parameter(Mandatory = $true)][string]$Method,
              [Parameter(Mandatory = $true)][string]$Path,
              [object]$Body = $null
            )

            $headers = @{
              Authorization = "Bearer $env:GITHUB_API_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $uri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)$Path"

            if ($null -eq $Body) {
              return Invoke-RestMethod -Method $Method -Uri $uri -Headers $headers
            }

            $json = $Body | ConvertTo-Json -Depth 8 -Compress
            return Invoke-RestMethod -Method $Method -Uri $uri -Headers $headers -ContentType "application/json" -Body $json
          }

          function Get-OpenSyncPullRequest {
            $head = [System.Uri]::EscapeDataString("$($env:GITHUB_REPOSITORY_OWNER):$($env:SYNC_BRANCH)")
            $pulls = @(Invoke-GitHubApi -Method "GET" -Path "/pulls?state=open&base=main&head=$head")
            return $pulls | Select-Object -First 1
          }

          $null = git fetch --no-tags --depth=1 origin "main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch latest origin/main." }

          git ls-remote --exit-code --heads origin $env:SYNC_BRANCH | Out-Null
          $syncBranchExists = $LASTEXITCODE -eq 0
          if ($syncBranchExists) {
            $null = git fetch --no-tags --depth=1 origin "$($env:SYNC_BRANCH):refs/remotes/origin/$($env:SYNC_BRANCH)"
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch existing automation branch." }
          }

          $null = git checkout -B $env:SYNC_BRANCH refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to create automation branch from latest main." }

          $generatedBytes = [System.IO.File]::ReadAllBytes($typesTempPath)
          [System.IO.File]::WriteAllBytes($env:TYPES_PATH, $generatedBytes)

          $changes = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect generated type drift." }
          if ($changes.Count -eq 0) {
            Write-Host "Canonical Supabase types are already synchronized."
            $existingPr = Get-OpenSyncPullRequest
            if ($null -ne $existingPr) {
              $null = Invoke-GitHubApi -Method "PATCH" -Path "/pulls/$($existingPr.number)" -Body @{ state = "closed" }
              Write-Host "Closed stale Supabase types PR #$($existingPr.number)."
            }
            if ($syncBranchExists) {
              git push origin --delete $env:SYNC_BRANCH
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale automation branch." }
            }
            exit 0
          }

          $unexpected = @($changes | Where-Object { $_ -notmatch ([regex]::Escape($env:TYPES_PATH) + '$') })
          if ($unexpected.Count -ne 0) {
            throw "Unexpected generated changes detected: $($unexpected -join '; ')"
          }

          $null = git add $env:TYPES_PATH
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage canonical Supabase types." }
          $null = git config user.name "github-actions[bot]"
          $null = git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $null = git commit -m "chore(supabase): sync generated types"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit canonical Supabase types." }

          if ($syncBranchExists) {
            git push --force-with-lease origin "HEAD:refs/heads/$($env:SYNC_BRANCH)"
          } else {
            git push --set-upstream origin "HEAD:refs/heads/$($env:SYNC_BRANCH)"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $headSha = (git rev-parse HEAD).Trim()
          if ($headSha -notmatch "^[0-9a-f]{40}$") { throw "Invalid generated head SHA." }

          $existingPr = Get-OpenSyncPullRequest
          if ($null -eq $existingPr) {
            $pr = Invoke-GitHubApi -Method "POST" -Path "/pulls" -Body @{
              base = "main"
              head = $env:SYNC_BRANCH
              title = "chore(supabase): sync generated types"
              body = "Automated canonical type regeneration from the live Supabase schema. Only src/integrations/supabase/types.generated.ts may change. This automation never writes directly to main; merge remains subject to normal PR/release gates."
            }
            Write-Host "Created Supabase types PR #$($pr.number)."
          } else {
            Write-Host "Updated existing Supabase types PR #$($existingPr.number) through branch synchronization."
          }

          foreach ($workflow in @("security-check.yml", "security-scan.yml", "ssot-enforcement.yml", "ssot-tests.yml")) {
            $null = Invoke-GitHubApi -Method "POST" -Path "/actions/workflows/$workflow/dispatches" -Body @{ ref = $env:SYNC_BRANCH }
            Write-Host "Dispatched $workflow for $headSha."
          }

          Write-Host "Generated types published for review at exact SHA $headSha."
