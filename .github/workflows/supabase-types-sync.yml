name: Supabase Types Sync

# G5 bootstrap: workflow-file changes intentionally trigger live type reconciliation.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-types-sync.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "tools/supabase/generate-supabase-types.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-types-sync-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_PROJECT_ID: "xhdowzacfujckjelqhtd"
  TYPES_PATH: "src/integrations/supabase/types.generated.ts"

jobs:
  sync-types:
    name: Regenerate canonical database types
    # Type generation is a lightweight remote-only reconciliation and must not
    # depend on the optional heavy Windows self-hosted runner being online.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Assert main-only execution
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "washingtonmsdj/acheguese" ]; then
            echo "Unexpected repository: $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Only refs/heads/main is authorized. Received $GITHUB_REF" >&2
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing." >&2
            exit 1
          fi

      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Setup canonical Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate types from live Supabase schema
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:types

          if [ ! -f "$TYPES_PATH" ]; then
            echo "Canonical Supabase type generator did not create $TYPES_PATH." >&2
            exit 1
          fi

          if [ ! -s "$TYPES_PATH" ] || ! grep -q "export type Database" "$TYPES_PATH"; then
            echo "Canonical Supabase type generator returned an invalid artifact." >&2
            exit 1
          fi

          cp "$TYPES_PATH" "$RUNNER_TEMP/acheguese-supabase-types.generated.ts"

      - name: Apply generated types to latest main
        shell: bash
        run: |
          set -euo pipefail
          TYPES_TEMP_PATH="$RUNNER_TEMP/acheguese-supabase-types.generated.ts"
          if [ ! -f "$TYPES_TEMP_PATH" ]; then
            echo "Generated Supabase types artifact is missing from RUNNER_TEMP." >&2
            exit 1
          fi

          refresh_main_and_commit_types() {
            git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
            git checkout -B main refs/remotes/origin/main
            cp "$TYPES_TEMP_PATH" "$TYPES_PATH"

            mapfile -t changes < <(git status --porcelain)
            if [ "${#changes[@]}" -eq 0 ]; then
              echo "Canonical Supabase types are already synchronized."
              return 1
            fi

            for change in "${changes[@]}"; do
              case "$change" in
                *"$TYPES_PATH") ;;
                *)
                  echo "Unexpected generated change detected: $change" >&2
                  exit 2
                  ;;
              esac
            done

            git add "$TYPES_PATH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(g5): sync Supabase generated types"
            return 0
          }

          if ! refresh_main_and_commit_types; then
            status=$?
            if [ "$status" -eq 1 ]; then
              exit 0
            fi
            exit "$status"
          fi

          if git push origin HEAD:main; then
            exit 0
          fi

          echo "main advanced or the first push was rejected; refreshing once before a final push."
          if ! refresh_main_and_commit_types; then
            status=$?
            if [ "$status" -eq 1 ]; then
              exit 0
            fi
            exit "$status"
          fi

          git push origin HEAD:main
