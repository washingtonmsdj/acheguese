name: Supabase Types Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-types-sync.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "tools/supabase/generate-supabase-types.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-types-sync-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SUPABASE_CLI_VERSION: "2.115.0"
  SUPABASE_PROJECT_REF: "xhdowzacfujckjelqhtd"
  TYPES_PATH: "src/integrations/supabase/types.generated.ts"

jobs:
  sync-types:
    name: Regenerate canonical database types
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Assert main-only execution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            throw "Unexpected repository: $env:GITHUB_REPOSITORY"
          }
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Only refs/heads/main is authorized. Received $env:GITHUB_REF"
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            throw "GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing."
          }

      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Regenerate types from live Supabase schema
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $lines = @(& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" gen types typescript --project-id $env:SUPABASE_PROJECT_REF)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = ($lines -join "`n") + "`n"
          if ([string]::IsNullOrWhiteSpace($text) -or $text -notmatch "export type Database") {
            throw "Supabase type generation returned an invalid artifact."
          }
          $typesTempPath = Join-Path $env:RUNNER_TEMP "acheguese-supabase-types.generated.ts"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($typesTempPath, $text, $utf8NoBom)

      - name: Apply generated types to latest main
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $typesTempPath = Join-Path $env:RUNNER_TEMP "acheguese-supabase-types.generated.ts"
          if (-not (Test-Path -LiteralPath $typesTempPath)) {
            throw "Generated Supabase types artifact is missing from RUNNER_TEMP."
          }

          function Refresh-MainAndCommitTypes {
            $null = git fetch --no-tags --depth=1 origin "main:refs/remotes/origin/main"
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch latest origin/main." }

            $null = git checkout -B main refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw "Failed to checkout latest origin/main." }

            $generatedBytes = [System.IO.File]::ReadAllBytes($typesTempPath)
            [System.IO.File]::WriteAllBytes($env:TYPES_PATH, $generatedBytes)

            $changes = @(git status --porcelain)
            if ($LASTEXITCODE -ne 0) { throw "Failed to inspect generated type drift." }
            if ($changes.Count -eq 0) {
              Write-Host "Canonical Supabase types are already synchronized."
              return $false
            }

            $unexpected = @($changes | Where-Object { $_ -notmatch ([regex]::Escape($env:TYPES_PATH) + '$') })
            if ($unexpected.Count -ne 0) {
              throw "Unexpected generated changes detected: $($unexpected -join '; ')"
            }

            $null = git add $env:TYPES_PATH
            if ($LASTEXITCODE -ne 0) { throw "Failed to stage canonical Supabase types." }
            $null = git config user.name "github-actions[bot]"
            $null = git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            $null = git commit -m "chore(g5): sync Supabase generated types"
            if ($LASTEXITCODE -ne 0) { throw "Failed to commit canonical Supabase types." }
            return $true
          }

          $hasCommit = Refresh-MainAndCommitTypes
          if (-not $hasCommit) { exit 0 }

          git push origin HEAD:main
          if ($LASTEXITCODE -eq 0) { exit 0 }

          Write-Host "main advanced or the first push was rejected; refreshing once before a final push."
          $hasCommit = Refresh-MainAndCommitTypes
          if (-not $hasCommit) { exit 0 }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
