name: Supabase Types Sync

# G5 bootstrap: workflow-file changes intentionally trigger live type reconciliation.
# 2026-09-18: publication is PR-based so main can require pull requests without
# granting a direct-write bypass to the canonical generated-types publisher.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-types-sync.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "tools/supabase/generate-supabase-types.ts"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: supabase-types-sync-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VITE_SUPABASE_PROJECT_ID: "xhdowzacfujckjelqhtd"
  SUPABASE_POOLER_HOST: "aws-0-sa-east-1.pooler.supabase.com"
  TYPES_PATH: "src/integrations/supabase/types.generated.ts"
  SYNC_BRANCH: "automation/supabase-types-sync"

jobs:
  sync-types:
    name: Regenerate canonical database types
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Assert main-only execution and provider credentials
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            throw "Unexpected repository: $env:GITHUB_REPOSITORY"
          }
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Only refs/heads/main is authorized. Received $env:GITHUB_REF"
          }

          $hasAccessToken = -not [string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)
          $hasDbPassword = -not [string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)
          if (-not $hasAccessToken -and -not $hasDbPassword) {
            throw "Neither SUPABASE_ACCESS_TOKEN nor SUPABASE_DB_PASSWORD is configured."
          }
          if ($hasDbPassword) {
            Write-Output "::add-mask::$($env:SUPABASE_DB_PASSWORD)"
          }

      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Setup canonical Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regenerate types from live Supabase schema
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $hasAccessToken = -not [string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)
          if (-not $hasAccessToken) {
            if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) {
              throw "SUPABASE_DB_PASSWORD is required when SUPABASE_ACCESS_TOKEN is unavailable."
            }

            $encodedPassword = [System.Uri]::EscapeDataString($env:SUPABASE_DB_PASSWORD)
            $projectRef = $env:VITE_SUPABASE_PROJECT_ID
            $poolerHost = $env:SUPABASE_POOLER_HOST
            $dbUrl = "postgresql://postgres.$projectRef`:$encodedPassword@$poolerHost`:5432/postgres?sslmode=require"
            Write-Output "::add-mask::$dbUrl"
            $env:SUPABASE_DB_URL = $dbUrl
            Write-Host "SUPABASE_ACCESS_TOKEN unavailable; using canonical Supabase DB URL type-generation fallback."
          }

          npm run generate:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path -LiteralPath $env:TYPES_PATH)) {
            throw "Canonical Supabase type generator did not create $env:TYPES_PATH."
          }

          $text = [System.IO.File]::ReadAllText($env:TYPES_PATH)
          if ([string]::IsNullOrWhiteSpace($text) -or $text -notmatch "export type Database") {
            throw "Canonical Supabase type generator returned an invalid artifact."
          }

          $typesTempPath = Join-Path $env:RUNNER_TEMP "acheguese-supabase-types.generated.ts"
          $generatedBytes = [System.IO.File]::ReadAllBytes($env:TYPES_PATH)
          [System.IO.File]::WriteAllBytes($typesTempPath, $generatedBytes)

      - name: Publish generated types to bot-owned branch
        id: publish
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $typesTempPath = Join-Path $env:RUNNER_TEMP "acheguese-supabase-types.generated.ts"
          if (-not (Test-Path -LiteralPath $typesTempPath)) {
            throw "Generated Supabase types artifact is missing from RUNNER_TEMP."
          }

          git fetch --no-tags --depth=1 origin "main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch latest origin/main." }

          git checkout -B $env:SYNC_BRANCH refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to create the bot-owned sync branch from latest main." }

          $generatedBytes = [System.IO.File]::ReadAllBytes($typesTempPath)
          [System.IO.File]::WriteAllBytes($env:TYPES_PATH, $generatedBytes)

          $changes = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect generated type drift." }

          if ($changes.Count -eq 0) {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Canonical Supabase types are already synchronized."
            exit 0
          }

          $unexpected = @($changes | Where-Object { $_ -notmatch ([regex]::Escape($env:TYPES_PATH) + '$') })
          if ($unexpected.Count -ne 0) {
            throw "Unexpected generated changes detected: $($unexpected -join '; ')"
          }

          git add $env:TYPES_PATH
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage canonical Supabase types." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(g5): sync Supabase generated types"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit canonical Supabase types." }

          # This branch is exclusively owned by this workflow and is rebuilt from latest main
          # on every run. Force-pushing it avoids accumulating stale generated commits while
          # keeping main protected from direct writes.
          git push --force origin "HEAD:refs/heads/$env:SYNC_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Open or refresh generated-types pull request
        if: steps.publish.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.SYNC_BRANCH;
            const head = `${owner}:${branch}`;
            const title = "chore(g5): sync Supabase generated types";
            const body = [
              "Automated canonical Supabase type reconciliation.",
              "",
              "- source: live Supabase schema via the repository generator",
              "- allowed generated artifact: `src/integrations/supabase/types.generated.ts` only",
              "- base: latest `main` observed by the workflow",
              "- publication: pull request; this workflow never pushes generated types directly to `main`",
              "",
              "Do not edit the generated snapshot manually. Merge only after the normal release gates are satisfied.",
              "",
              "Related: #28",
            ].join("\n");

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              base: "main",
              per_page: 100,
            });

            if (existing.length === 0) {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: "main",
                title,
                body,
                maintainer_can_modify: true,
              });
              core.notice(`Created Supabase types sync PR #${created.number}.`);
            } else {
              const pr = existing[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.notice(`Refreshed Supabase types sync PR #${pr.number}.`);
            }
