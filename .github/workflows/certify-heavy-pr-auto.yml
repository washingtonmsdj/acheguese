name: Production Auth Certification (Temporary)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PRODUCTION_SHA: 694b4f962cc26695abc3bd87afed0e806f5cf580
  PRODUCTION_URL: https://acheguese.com.br

concurrency:
  group: production-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify-production-auth:
    name: Production logout for exact deployed SHA
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'cert/production-auth-')
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - playwright-chromium
      - remote-only
    timeout-minutes: 45

    steps:
      - name: Validate production certification provenance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64") {
            Write-Error "Certification blocked: runner must be Windows x64."
            exit 1
          }
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            Write-Error "Certification blocked: unexpected repository $env:GITHUB_REPOSITORY."
            exit 1
          }
          if ($env:PRODUCTION_SHA -notmatch '^[0-9a-f]{40}$') {
            Write-Error "Certification blocked: production SHA is not exact."
            exit 1
          }
          if ($env:PRODUCTION_URL -ne "https://acheguese.com.br") {
            Write-Error "Certification blocked: unexpected production URL."
            exit 1
          }
          Write-Host "Production certification target: $env:PRODUCTION_SHA @ $env:PRODUCTION_URL"

      - name: Checkout exact deployed production SHA
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ env.PRODUCTION_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout SHA
        shell: powershell
        run: |
          $actualSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualSha -ne $env:PRODUCTION_SHA.ToLowerInvariant()) {
            Write-Error "Certification blocked: checkout SHA mismatch. Expected=$env:PRODUCTION_SHA Actual=$actualSha"
            exit 1
          }
          Write-Host "Pinned production checkout confirmed: $actualSha"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        shell: powershell
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        shell: powershell
        run: npx playwright install chromium

      - name: Run production authenticated logout E2E
        id: logout_e2e
        continue-on-error: true
        shell: powershell
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://acheguese.com.br
          VITE_PUBLIC_APP_URL: https://acheguese.com.br
          VITE_SUPABASE_URL: https://xhdowzacfujckjelqhtd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dc-rd2YjKuZ5KJc_zRYVYA_ANmcFxKk
          VITE_SUPABASE_ANON_KEY: sb_publishable_dc-rd2YjKuZ5KJc_zRYVYA_ANmcFxKk
          E2E_SUPABASE_URL: https://xhdowzacfujckjelqhtd.supabase.co
          E2E_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dc-rd2YjKuZ5KJc_zRYVYA_ANmcFxKk
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          ACCOUNT_TARGET_IS_PREVIEW: false
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:E2E_USER_EMAIL) -or [string]::IsNullOrWhiteSpace($env:E2E_USER_PASSWORD)) {
            Write-Error "Certification blocked: authenticated E2E credentials are not configured."
            exit 1
          }
          npx playwright test tests/e2e/logout-authenticated.spec.ts --project=chromium --reporter=list --retries=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Print production logout diagnostics
        if: steps.logout_e2e.outcome == 'failure'
        shell: powershell
        run: |
          Write-Host "===== Production authenticated logout diagnostics ====="
          $contexts = @(Get-ChildItem -Path "test-results" -Recurse -File -Filter "error-context.md" -ErrorAction SilentlyContinue)
          if ($contexts.Count -eq 0) {
            Write-Host "No error-context.md files found."
          } else {
            foreach ($context in $contexts) {
              Write-Host "--- $($context.FullName) ---"
              Get-Content -Path $context.FullName -ErrorAction SilentlyContinue
            }
          }

      - name: Record production certification result
        if: always()
        shell: powershell
        env:
          LOGOUT_OUTCOME: ${{ steps.logout_e2e.outcome }}
        run: |
          @(
            "## Production auth certification",
            "- Deployment SHA: $env:PRODUCTION_SHA",
            "- Target: $env:PRODUCTION_URL",
            "- Authenticated logout E2E: $env:LOGOUT_OUTCOME",
            "- Retries: 0"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8

          Write-Host "Authenticated production logout E2E=$env:LOGOUT_OUTCOME"
          if ($env:LOGOUT_OUTCOME -ne "success") {
            Write-Error "Production auth certification failed."
            exit 1
          }
          Write-Host "PRODUCTION_AUTH_LOGOUT_CERTIFICATION_PASS"
