name: Heavy PR Certification (Auto)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    # Heavy Playwright/regression certification protects product, DB and test
    # changes. Docs-only and workflow-only PRs use their own focused checks.
    # Product PRs run on GitHub-hosted Windows so certification does not depend
    # on the availability of a developer machine or repository self-hosted runner.
    # GitHub paths-ignore skips only when every changed path matches.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/**"
  push:
    branches:
      - main
    # Docs-only main updates do not need heavyweight runtime/browser certification.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: heavy-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-heavy-pr:
    name: Heavy gates for exact source SHA
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Validate runner and PR provenance
        shell: powershell
        env:
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64") {
            Write-Error "Certification blocked: runner must be Windows x64."
            exit 1
          }
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            Write-Error "Certification blocked: unexpected repository $env:GITHUB_REPOSITORY."
            exit 1
          }
          if ($env:HEAD_REPOSITORY -ne $env:GITHUB_REPOSITORY) {
            Write-Error "Certification blocked: heavy certification never executes fork PR code."
            exit 1
          }
          $sha = ([string]$env:TARGET_SHA).Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$') {
            Write-Error "Certification blocked: target is not an exact 40-character SHA."
            exit 1
          }
          Write-Host "Automatic certification target: $sha"

      - name: Checkout exact target SHA
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout SHA
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualSha -ne $env:EXPECTED_SHA.ToLowerInvariant()) {
            Write-Error "Certification blocked: checkout SHA mismatch. Expected=$env:EXPECTED_SHA Actual=$actualSha"
            exit 1
          }
          Write-Host "Pinned checkout confirmed: $actualSha"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        shell: powershell
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run critical LGPD/security contract tests
        shell: powershell
        env:
          CI: true
        run: |
          npx vitest --run `
            tests/security/lgpd-purge-policy-security.test.ts `
            tests/security/lgpd-purge-worker-contract.test.ts `
            tests/security/lgpd-purge-claim-schema-contract.test.ts `
            tests/security/account-operational-edge-policy.test.ts `
            tests/security/session-rpc-auth-authority-security.test.ts `
            --pool=threads `
            --maxWorkers=1 `
            --reporter=verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run MVP architecture contract
        id: mvp_arch
        continue-on-error: true
        shell: powershell
        env:
          CI: true
        run: |
          New-Item -ItemType Directory -Force ".gate-status" | Out-Null
          Remove-Item ".gate-status/mvp-architecture.success" -Force -ErrorAction SilentlyContinue
          npm run validate:workflow:references
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:mvp:architecture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -Path ".gate-status/mvp-architecture.success" -Value "success" -Encoding ASCII

      - name: Install Playwright Chromium
        shell: powershell
        run: npx playwright install chromium

      - name: Run deterministic Auth/session contracts against exact local SHA
        id: auth_session
        continue-on-error: true
        shell: powershell
        env:
          CI: true
        run: |
          Remove-Item ".gate-status/auth-session.success" -Force -ErrorAction SilentlyContinue
          npx vitest --run `
            tests/regression/auth/logout.test.ts `
            src/core/session/services/SessionService.initialization.spec.ts `
            src/core/session/services/SessionService.refresh-race.spec.ts `
            src/core/routing/components/__tests__/ProtectedRoute.spec.tsx `
            src/core/messaging/services/BusinessDirectMessagingService.test.ts `
            --pool=threads `
            --maxWorkers=1 `
            --reporter=verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ".gate-status" | Out-Null
          Set-Content -Path ".gate-status/auth-session.success" -Value "success" -Encoding ASCII

      - name: Run active MVP regression contract
        id: regression
        continue-on-error: true
        shell: powershell
        env:
          CI: true
        run: |
          Remove-Item ".gate-status/regression.success" -Force -ErrorAction SilentlyContinue
          npm run test:mvp:regression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ".gate-status" | Out-Null
          Set-Content -Path ".gate-status/regression.success" -Value "success" -Encoding ASCII

      - name: Validate territorial regression boundaries
        id: boundaries
        continue-on-error: true
        shell: powershell
        run: |
          $sourceFiles = @(
            Get-ChildItem -Path "src/modules/guide" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/]__mocks__[\\/]' -and
                $_.Name -notmatch '\.(test|spec)\.[^.]+$'
              }