name: Phase 4.6 Recovery Snapshot (Temporary)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CANDIDATE_SHA: 934f9df1004bee5ba185500cde7b5bad59e59123
  PROJECT_REF: xhdowzacfujckjelqhtd

concurrency:
  group: phase-4-6-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture-recovery:
    name: Fresh remote recovery snapshot for exact Phase 4.6 candidate
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'cert/recovery-4.6-')
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - playwright-chromium
      - remote-only
    timeout-minutes: 60

    steps:
      - name: Validate runner and recovery provenance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64") {
            Write-Error "Recovery blocked: runner must be Windows x64."
            exit 1
          }
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            Write-Error "Recovery blocked: unexpected repository."
            exit 1
          }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
            Write-Error "Recovery blocked: candidate SHA must be exact."
            exit 1
          }
          if ($env:PROJECT_REF -ne "xhdowzacfujckjelqhtd") {
            Write-Error "Recovery blocked: unexpected Supabase project."
            exit 1
          }
          Write-Host "Recovery candidate: $env:CANDIDATE_SHA"

      - name: Checkout temporary recovery harness
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: harness

      - name: Checkout exact Phase 4.6 candidate
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Capture fresh recovery package to private Drive sync target
        id: recovery
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Join-Path $env:GITHUB_WORKSPACE "harness\tools\recovery-capture-temp-v2.ps1"
          $candidate = Join-Path $env:GITHUB_WORKSPACE "candidate"
          & $script -CandidateSha $env:CANDIDATE_SHA -CandidatePath $candidate -ProjectRef $env:PROJECT_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record recovery summary
        if: always()
        shell: powershell
        run: |
          @(
            "## Phase 4.6 fresh recovery snapshot",
            "- Candidate SHA: $env:CANDIDATE_SHA",
            "- Snapshot: ${{ steps.recovery.outputs.snapshot_id }}",
            "- Captured: ${{ steps.recovery.outputs.captured_at }}",
            "- Valid until: ${{ steps.recovery.outputs.valid_until }}",
            "- Migration: ${{ steps.recovery.outputs.migration_count }} / ${{ steps.recovery.outputs.latest_migration }}",
            "- Auth users / identities / MFA: ${{ steps.recovery.outputs.auth_users }} / ${{ steps.recovery.outputs.auth_identities }} / ${{ steps.recovery.outputs.auth_mfa }}",
            "- Storage buckets / objects / bytes: ${{ steps.recovery.outputs.storage_buckets }} / ${{ steps.recovery.outputs.storage_objects }} / ${{ steps.recovery.outputs.storage_bytes }}",
            "- Storage mode: fresh remote download; per-object SHA-256 captured",
            "- Technical Business rows / active: ${{ steps.recovery.outputs.technical_rows }} / ${{ steps.recovery.outputs.technical_active }}",
            "- Active businesses / official education seed: ${{ steps.recovery.outputs.active_businesses }} / ${{ steps.recovery.outputs.education_seed }}",
            "- Edge Functions / secret names: ${{ steps.recovery.outputs.edge_functions }} / ${{ steps.recovery.outputs.secret_names }}",
            "- Artifact bytes: ${{ steps.recovery.outputs.artifact_bytes }}",
            "- Artifact SHA-256: ${{ steps.recovery.outputs.artifact_sha256 }}",
            "- Drive sync-target local readback hash match: ${{ steps.recovery.outputs.readback_match }}",
            "- Cloud-side Drive confirmation: performed separately after this job"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Cleanup sensitive runner temp data
        if: always()
        shell: powershell
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "harness") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "candidate") -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter "acheguese-recovery-*" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
