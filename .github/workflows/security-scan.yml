name: Security Scan

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tools/security/validate-npm-audit-residuals.mjs"
      - "tests/security/dependency-audit-residuals.test.ts"
      - "docs/09-reference/governance/security/DEPENDENCY_AUDIT_RESIDUALS.json"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Security Scan
        id: eslint_security
        continue-on-error: true
        run: npm run lint:security

      - name: Run npm audit (production moderate+ gate)
        id: npm_audit_production
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate

      - name: Capture npm audit (full tree high and critical)
        id: npm_audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-full.json
          audit_exit=$?
          set -e
          echo "raw_exit_code=$audit_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate governed full-tree audit residuals
        id: npm_audit_full_residuals
        continue-on-error: true
        run: node tools/security/validate-npm-audit-residuals.mjs npm-audit-full.json

      - name: Run Semgrep Security Scan
        id: semgrep
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/react
            p/typescript
            p/xss

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_${version}_checksums.txt" --output checksums.txt
          grep " $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            ./gitleaks git . \
              --log-opts="${base_sha}..${head_sha}" \
              --config .gitleaks.toml \
              --redact \
              --no-banner \
              --report-format json \
              --report-path gitleaks-report.json
            echo "Gitleaks scope: PR commits ${base_sha}..${head_sha}" >> "$GITHUB_STEP_SUMMARY"
          else
            ./gitleaks dir . \
              --config .gitleaks.toml \
              --redact \
              --no-banner \
              --report-format json \
              --report-path gitleaks-report.json
            echo "Gitleaks scope: current working tree." >> "$GITHUB_STEP_SUMMARY"
          fi

          baseline_count="$(grep -Ev '^(#|[[:space:]]*$)' .gitleaksignore | wc -l | tr -d ' ')"
          echo "Historical Gitleaks baseline retained separately: ${baseline_count} fingerprint(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Scan for XSS patterns
        id: xss_patterns
        continue-on-error: true
        shell: bash
        run: |
          if grep -r "\.innerHTML\s*=" src/ | grep -v "DOMPurify"; then
            echo "Found innerHTML without DOMPurify"
            exit 1
          fi
          if grep -r "dangerouslySetInnerHTML" src/; then
            echo "Found dangerouslySetInnerHTML"
            exit 1
          fi
          if grep -r "localStorage.*token" src/ | grep -v "// SAFE:"; then
            echo "Found token storage in localStorage"
            exit 1
          fi
          if grep -r "document\.cookie" src/ | grep -v "// SAFE:"; then
            echo "Found document.cookie access"
            exit 1
          fi

      - name: TypeScript Strict Check
        id: typescript_strict
        continue-on-error: true
        run: npx tsc --noEmit --strict

      - name: Generate truthful security report
        if: always()
        shell: bash
        run: |
          {
            echo "# Security Scan Report"
            echo
            echo "**Commit:** ${{ github.sha }}"
            echo
            echo "| Gate | Outcome |"
            echo "| --- | --- |"
            echo "| ESLint security | ${{ steps.eslint_security.outcome }} |"
            echo "| npm audit (production moderate+) | ${{ steps.npm_audit_production.outcome }} |"
            echo "| npm audit (full tree raw capture) | exit ${{ steps.npm_audit.outputs.raw_exit_code }} |"
            echo "| npm audit (full tree residual-aware gate) | ${{ steps.npm_audit_full_residuals.outcome }} |"
            echo "| Semgrep | ${{ steps.semgrep.outcome }} |"
            echo "| Gitleaks | ${{ steps.gitleaks.outcome }} |"
            echo "| XSS patterns | ${{ steps.xss_patterns.outcome }} |"
            echo "| TypeScript strict | ${{ steps.typescript_strict.outcome }} |"
            echo
            echo "The artifact is a convenience copy. Scanner outcomes above are the security gate."
          } | tee security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security diagnostics (non-gating transport)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            security-report.md
            npm-audit-full.json
            gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce security scan outcomes
        if: always()
        shell: bash
        env:
          ESLINT_OUTCOME: ${{ steps.eslint_security.outcome }}
          NPM_PROD_OUTCOME: ${{ steps.npm_audit_production.outcome }}
          NPM_FULL_RESIDUAL_OUTCOME: ${{ steps.npm_audit_full_residuals.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          XSS_OUTCOME: ${{ steps.xss_patterns.outcome }}
          TYPESCRIPT_OUTCOME: ${{ steps.typescript_strict.outcome }}
        run: |
          failed=0
          for entry in \
            "ESLint security=$ESLINT_OUTCOME" \
            "npm audit production=$NPM_PROD_OUTCOME" \
            "npm audit full residual-aware=$NPM_FULL_RESIDUAL_OUTCOME" \
            "Semgrep=$SEMGREP_OUTCOME" \
            "Gitleaks=$GITLEAKS_OUTCOME" \
            "XSS patterns=$XSS_OUTCOME" \
            "TypeScript strict=$TYPESCRIPT_OUTCOME"
          do
            name="${entry%%=*}"
            outcome="${entry#*=}"
            if [ "$outcome" != "success" ]; then
              echo "::error::Security gate failed: $name ($outcome)"
              failed=1
            fi
          done
          exit "$failed"