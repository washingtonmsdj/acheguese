name: Heavy Pre-Merge Certification

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character commit SHA from washingtonmsdj/acheguese"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  certify-heavy:
    name: Heavy gates for explicit SHA
    runs-on:
      - self-hosted
      - linux
      - x64
      - acheguese-heavy-wsl2
      - playwright-chromium
      - remote-only
    timeout-minutes: 90

    steps:
      - name: Validate and attest certification target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          expected_repository="washingtonmsdj/acheguese"
          if [[ "${GITHUB_REPOSITORY}" != "${expected_repository}" ]]; then
            echo "Certification blocked: unexpected repository ${GITHUB_REPOSITORY}."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Certification blocked: only workflow_dispatch is allowed."
            exit 1
          fi

          target_sha="${TARGET_SHA,,}"
          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Certification blocked: input must be an exact 40-character SHA."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /dev/null \
            "https://api.github.com/repos/${expected_repository}/commits/${target_sha}"

          echo "sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Heavy certification target"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- SHA: ${target_sha}"
            echo "- Actor: ${GITHUB_ACTOR}"
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Workflow ref: ${GITHUB_WORKFLOW_REF}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout attested SHA only
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout matches attested SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Certification blocked: checkout SHA mismatch."
            echo "Expected: ${EXPECTED_SHA}"
            echo "Actual:   ${actual_sha}"
            exit 1
          fi
          echo "Pinned checkout confirmed: ${actual_sha}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run deterministic public territorial E2E
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8099
          VITE_PUBLIC_APP_URL: http://127.0.0.1:8099
          VITE_SUPABASE_URL: https://ci-fixtures.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-fixture-key
          VITE_SUPABASE_ANON_KEY: ci-public-fixture-key
        run: npm run test:e2e:ci

      - name: Run non-destructive authenticated Account E2E
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://acheguese.com.br
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${E2E_USER_EMAIL}" || -z "${E2E_USER_PASSWORD}" ]]; then
            echo "Certification blocked: authenticated E2E credentials are not configured."
            exit 1
          fi
          npm run test:e2e:account-authenticated

      - name: Run regression tests with non-empty discovery
        shell: bash
        env:
          CI: true
        run: |
          set -euo pipefail
          mapfile -t regression_files < <(find tests -maxdepth 1 -type f -name 'regression-*.test.ts' -print | sort)
          if (( ${#regression_files[@]} == 0 )); then
            echo "Certification blocked: no regression-*.test.ts files were found."
            exit 1
          fi
          printf 'Regression files (%d):\n' "${#regression_files[@]}"
          printf ' - %s\n' "${regression_files[@]}"
          npx vitest --run "${regression_files[@]}"

      - name: Check for URL manual construction
        shell: bash
        run: |
          set -euo pipefail
          if grep -r "'/pontos-turisticos/'" src/modules/guide --exclude-dir=__mocks__ --exclude="*.test.ts" --exclude="*.spec.ts"; then
            echo "Found manual URL construction; use buildTouristPointDetailUrl"
            exit 1
          fi

      - name: Check for legacy field usage
        shell: bash
        run: |
          set -euo pipefail
          if grep -r "point\.neighborhood" src/modules/guide --exclude-dir=__mocks__ --exclude="*.test.ts" --exclude="*.spec.ts" | grep -v "point\.location?.name ?? point\.neighborhood"; then
            echo "Found direct legacy neighborhood usage"
            exit 1
          fi

      - name: Check for invalid territorial filters
        shell: bash
        run: |
          set -euo pipefail
          if grep -r "\.eq('state'" src/modules/guide --exclude-dir=__mocks__ --exclude="*.test.ts" --exclude="*.spec.ts"; then
            echo "Found invalid territorial state filter"
            exit 1
          fi

      - name: Record certification contract
        if: always()
        shell: bash
        run: |
          {
            echo "## Certification contract"
            echo "The workflow accepts only an exact SHA that exists in washingtonmsdj/acheguese and checks out that immutable SHA."
            echo "Public territorial E2E is fixture-backed and uses no local Supabase, Docker, service-role key, or Production seed."
            echo "Authenticated Account E2E uses only E2E_USER_EMAIL/E2E_USER_PASSWORD from GitHub Actions and covers mobile, tablet, and desktop in the target test suite."
            echo "Regression discovery fails closed when no regression test files are present."
            echo "No automatic fallback to GitHub-hosted runners exists."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload certification reports (non-gating transport)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: heavy-certification-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
