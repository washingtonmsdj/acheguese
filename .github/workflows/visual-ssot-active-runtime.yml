name: Visual SSOT Active Runtime

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/architecture/validate-active-frontend-visual-ssot.ts"
      - "tools/architecture/validate-visual-ssot.ts"
      - "tailwind.config.ts"
      - "index.html"
      - "public/theme-init.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-ssot-active-runtime.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tools/architecture/validate-active-frontend-visual-ssot.ts"
      - "tools/architecture/validate-visual-ssot.ts"
      - "tailwind.config.ts"
      - "index.html"
      - "public/theme-init.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-ssot-active-runtime.yml"
  workflow_dispatch:

concurrency:
  group: visual-ssot-active-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  visual-ssot-active-runtime:
    name: Visual SSOT Active Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical visual SSOT
        run: npm run validate:visual:ssot

      - name: Validate active frontend import graph
        run: npx tsx tools/architecture/validate-active-frontend-visual-ssot.ts
