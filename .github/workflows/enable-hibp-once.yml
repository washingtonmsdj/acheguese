name: Enable Supabase HIBP Protection (Temporary)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: enable-hibp-once
  cancel-in-progress: false

jobs:
  enable-hibp:
    name: Enable and verify leaked-password protection
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 10

    steps:
      - name: Validate runner and exact repository
        shell: powershell
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64") {
            Write-Error "Blocked: expected Windows x64 runner."
            exit 1
          }
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            Write-Error "Blocked: unexpected repository."
            exit 1
          }
          if ($env:TARGET_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            Write-Error "Blocked: invalid exact head SHA."
            exit 1
          }

      - name: Checkout exact PR head SHA
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # GitHub Actions secrets use alternate variable names so an absent secret
      # cannot overwrite a PAT already provisioned in the self-hosted runner
      # process environment. Values are never printed; only the selected source.
      - name: Enable and verify HIBP protection
        shell: powershell
        env:
          SUPABASE_PROJECT_REF: xhdowzacfujckjelqhtd
          GITHUB_SECRET_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_SECRET_SUPABASE_MANAGEMENT_API_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $accessSource = "absent"
          $managementSource = "absent"

          if (-not [string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            $accessSource = "runner_environment"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:GITHUB_SECRET_SUPABASE_ACCESS_TOKEN)) {
            $env:SUPABASE_ACCESS_TOKEN = $env:GITHUB_SECRET_SUPABASE_ACCESS_TOKEN
            $accessSource = "github_actions_secret"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SUPABASE_MANAGEMENT_API_TOKEN)) {
            $managementSource = "runner_environment"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:GITHUB_SECRET_SUPABASE_MANAGEMENT_API_TOKEN)) {
            $env:SUPABASE_MANAGEMENT_API_TOKEN = $env:GITHUB_SECRET_SUPABASE_MANAGEMENT_API_TOKEN
            $managementSource = "github_actions_secret"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            Write-Host "::add-mask::$env:SUPABASE_ACCESS_TOKEN"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SUPABASE_MANAGEMENT_API_TOKEN)) {
            Write-Host "::add-mask::$env:SUPABASE_MANAGEMENT_API_TOKEN"
          }

          Write-Host "SUPABASE_ACCESS_TOKEN source: $accessSource"
          Write-Host "SUPABASE_MANAGEMENT_API_TOKEN source: $managementSource"

          if (
            [string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN) -and
            [string]::IsNullOrWhiteSpace($env:SUPABASE_MANAGEMENT_API_TOKEN)
          ) {
            Write-Error "Blocked: no Supabase Management API PAT is available from GitHub Actions secrets or the runner environment."
            exit 1
          }

          node scripts/security/supabase-auth-hibp.mjs --apply --project-ref xhdowzacfujckjelqhtd --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/security/supabase-auth-hibp.mjs --check --project-ref xhdowzacfujckjelqhtd --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "SUPABASE_HIBP_ENABLED_AND_VERIFIED"
