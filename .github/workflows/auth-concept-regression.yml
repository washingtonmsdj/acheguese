concurrency:
  group: auth-concept-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: auth contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run account/access contract
        run: >-
          npx vitest run
          src/core/auth/services/AuthRecoveryAuthority.test.ts
          src/core/auth/services/AuthService.termsAcceptance.spec.ts
          src/core/auth/services/AuthService.recovery.spec.ts
          src/core/auth/utils/__tests__/authCallback.test.ts
          src/core/auth/utils/__tests__/authFlowStorage.test.ts
          src/core/auth/utils/__tests__/authJourney.test.ts
          src/core/auth/utils/__tests__/authPasswordRecoveryCooldown.test.ts
          src/core/session/services/SessionService.test.ts
          src/core/session/services/SessionService.refresh-race.spec.ts
          src/core/session/services/SessionService.initialization.spec.ts
          src/shared/config/publicAppOrigin.test.ts
          src/app/components/auth/AuthBrandHeader.spec.tsx
          src/app/features/onboarding/hooks/useCadastro.spec.tsx
          src/app/features/onboarding/pages/CadastroPage.spec.tsx
          src/app/features/onboarding/pages/CadastroPrimeiroAcessoPage.spec.tsx
          tests/architecture/auth-session-authority.test.ts
          tests/architecture/session-ssot-ownership.test.ts
          tests/architecture/session-provider-async-ownership.test.ts
          tests/regression/auth-concept-flow.test.ts
          tests/regression/auth-confirmation-resend-turnstile.test.ts
          tests/regression/auth-email-change-callback.test.ts
          tests/regression/auth-email-confirmation-callback.test.ts
          tests/regression/auth-mobile-concept.test.ts
          tests/regression/auth-route-ownership.test.ts
          tests/regression/auth-return-context.test.ts
          tests/regression/auth-google-oauth.test.ts
          tests/regression/auth-password-recovery-callback.test.ts
          tests/regression/auth-redirect-allowlist.test.ts
          tests/regression/multi-profile-session-hydration.test.ts
          tests/security/account-email-change-state-disposal.test.ts
          tests/security/account-password-reauthentication.test.ts
          tests/security/auth-google-id-token-contract.test.ts
          tests/security/auth-google-oauth-readiness.test.ts
          tests/security/auth-login-turnstile-contract.test.ts
          tests/security/auth-password-capability-authority.test.ts
          tests/security/auth-password-recovery-captcha.test.ts
          tests/security/auth-password-recovery-session-disposal.test.ts
          tests/security/auth-signup-turnstile-contract.test.ts
          tests/security/mfa-account-settings-fail-closed.test.ts

  responsive-layout:
    name: auth responsive layout, accessibility and captures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run auth browser regression and captures
        env:
          CI: "true"
          VITE_AUTH_GOOGLE_ENABLED: "true"
        run: >-
          npx playwright test
          tests/e2e/auth-concept-layout.spec.ts
          tests/e2e/auth-concept-capture.spec.ts
          tests/e2e/auth-email-confirmation.spec.ts
          tests/e2e/auth-oauth-recovery.spec.ts
          tests/e2e/auth-keyboard-accessibility.spec.ts
          --project=chromium

      - name: Upload account/access screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: auth-concept-captures
          path: auth-concept-captures/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: auth-concept-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
