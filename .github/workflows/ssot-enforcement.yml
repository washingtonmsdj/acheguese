name: SSOT Enforcement

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "URGENTE_LEIA_PRIMEIRO_REORGANIZACAO_GLOBAL.md"
      - "supabase/**"
      - "eslint.config.js"
      - ".eslintrc*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ssot-enforcement.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "URGENTE_LEIA_PRIMEIRO_REORGANIZACAO_GLOBAL.md"
      - "supabase/**"
      - "eslint.config.js"
      - ".eslintrc*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ssot-enforcement.yml"
  workflow_dispatch:

concurrency:
  group: ssot-enforcement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ssot-enforcement:
    name: SSOT Enforcement Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate dependency boundaries
        run: npm run validate:deps

      - name: Validate repository taxonomy
        run: npm run validate:taxonomy

      - name: Validate Phase 1 architecture guards
        run: npm run validate:architecture:phase1

      - name: Validate incremental architecture boundaries
        run: npm run validate:architecture:incremental

      - name: Validate Core Platform ownership
        run: npm run validate:architecture:core-platform

      - name: Validate architecture governance
        run: npm run validate:architecture:governance

      - name: Validate delivery architecture boundaries
        run: npm run validate:architecture:delivery

      - name: Validate communication architecture boundaries
        run: npm run validate:architecture:communication

      - name: Validate critical architecture file sizes
        run: npm run validate:architecture:file-sizes

      - name: Validate Maps architecture
        run: npm run validate:maps

      - name: Validate global SSOT contracts
        run: npm run validate:ssot

      - name: Validate community module boundaries
        run: npm run validate:architecture:community

      - name: Validate Education migration boundaries
        run: npx tsx tools/architecture/validate-education-module-boundaries.ts

      - name: Validate Gastronomy migration boundaries
        run: npx tsx tools/architecture/validate-gastronomy-module-boundaries.ts

      - name: Run ESLint Billing Rules
        run: |
          echo "🔍 Verificando conformidade SSOT com regras de billing..."
          npx eslint --config eslint-rules/configs/billing-rules.config.js 'src/**/*.{ts,tsx}' || {
            echo "❌ Violações de SSOT detectadas!"
            echo ""
            echo "Regras violadas:"
            echo "- Acesso direto a tabelas de subscription (use EntitlementResolver)"
            echo "- PLANS hardcoded (use CatalogService)"
            echo "- Import de tabelas legadas (gastronomy_subscriptions, business_subscriptions)"
            echo ""
            echo "Consulte .kiro/specs/monetization-multi-vertical-refactor/F7_SSOT_ENFORCEMENT.md"
            exit 1
          }

      - name: Run Contract Tests
        run: |
          echo "🧪 Executando testes de contrato..."
          npm run test -- src/core/billing/__tests__/contracts/ || {
            echo "❌ Testes de contrato falharam!"
            echo ""
            echo "Os contratos de API foram violados:"
            echo "- EntitlementResolver.resolve()"
            echo "- CatalogService.getEligibleCatalog()"
            echo "- SubscriptionContractService"
            echo ""
            exit 1
          }

      - name: Check for PLANS hardcoded
        run: |
          echo "🔍 Verificando PLANS hardcoded..."
          if grep -r "const PLANS = {" src/ --exclude-dir=node_modules --exclude-dir=__tests__; then
            echo "❌ PLANS hardcoded detectado!"
            echo ""
            echo "Arquivos com PLANS hardcoded:"
            grep -r "const PLANS = {" src/ --exclude-dir=node_modules --exclude-dir=__tests__ -l
            echo ""
            echo "❌ SSOT Violation: Use CatalogService.getEligibleCatalog() ao invés de PLANS hardcoded"
            echo ""
            echo "Exemplo correto:"
            echo "  const catalog = await CatalogService.getEligibleCatalog({"
            echo "    entity_family: 'company',"
            echo "    vertical: 'gastronomy',"
            echo "  });"
            echo ""
            exit 1
          fi
          echo "✅ Nenhum PLANS hardcoded detectado"

      - name: Check for direct subscription table access
        run: |
          echo "🔍 Verificando acesso direto a tabelas de subscription..."

          if grep -r "from('gastronomy_subscriptions')" src/ \
            --exclude-dir=node_modules \
            --exclude-dir=__tests__ \
            --exclude-dir=core/billing/services; then
            echo "❌ Acesso direto a gastronomy_subscriptions detectado!"
            echo ""
            echo "Arquivos com acesso direto:"
            grep -r "from('gastronomy_subscriptions')" src/ \
              --exclude-dir=node_modules \
              --exclude-dir=__tests__ \
              --exclude-dir=core/billing/services -l
            echo ""
            echo "❌ SSOT Violation: Use EntitlementResolver.resolve() ao invés de acesso direto"
            echo ""
            echo "Exemplo correto:"
            echo "  const entitlements = await EntitlementResolver.resolve({"
            echo "    user_id: userId,"
            echo "    subscription_scope: 'user',"
            echo "  });"
            echo ""
            exit 1
          fi

          if grep -r "from('business_subscriptions')" src/ \
            --exclude-dir=node_modules \
            --exclude-dir=__tests__ \
            --exclude-dir=core/billing/services; then
            echo "❌ Acesso direto a business_subscriptions detectado!"
            echo ""
            echo "❌ SSOT Violation: Use EntitlementResolver.resolve() ao invés de acesso direto"
            exit 1
          fi

          echo "✅ Nenhum acesso direto a tabelas de subscription detectado"

      - name: Check for planTier calculations in components
        run: |
          echo "🔍 Verificando cálculos de planTier em componentes..."

          if grep -r "planTier === 'pro'" src/ \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=__tests__ \
            --exclude-dir=core/billing; then
            echo "⚠️  Warning: Possível cálculo de entitlement em componente detectado"
            echo ""
            echo "Arquivos suspeitos:"
            grep -r "planTier === 'pro'" src/ \
              --include="*.tsx" \
              --exclude-dir=node_modules \
              --exclude-dir=__tests__ \
              --exclude-dir=core/billing -l
            echo ""
            echo "⚠️  Recomendação: Use useEntitlements() ao invés de comparar planTier diretamente"
            echo ""
            echo "Exemplo correto:"
            echo "  const { can } = useEntitlements({ business_id });"
            echo "  if (can('canUseFeature')) { ... }"
            echo ""
          fi

      - name: Summary
        if: success()
        run: |
          echo "✅ Todos os checks de SSOT Enforcement passaram!"
          echo ""
          echo "Verificações realizadas:"
          echo "  ✅ Global dependency boundaries"
          echo "  ✅ Repository taxonomy"
          echo "  ✅ Phase 1 architecture guards"
          echo "  ✅ Incremental architecture boundaries"
          echo "  ✅ Core Platform ownership"
          echo "  ✅ Architecture governance"
          echo "  ✅ Delivery architecture boundaries"
          echo "  ✅ Communication architecture boundaries"
          echo "  ✅ Critical architecture file sizes"
          echo "  ✅ Maps architecture"
          echo "  ✅ Global SSOT contracts"
          echo "  ✅ Community module boundaries"
          echo "  ✅ Education migration boundaries"
          echo "  ✅ Gastronomy migration boundaries"
          echo "  ✅ ESLint billing rules"
          echo "  ✅ Testes de contrato"
          echo "  ✅ PLANS hardcoded"
          echo "  ✅ Acesso direto a tabelas"
          echo "  ✅ Cálculos de entitlement"
          echo ""
          echo "Conformidade SSOT: 100%"
