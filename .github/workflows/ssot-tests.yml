name: SSOT Territorial Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ssot-tests.yml"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tools/seeds/seed-e2e-users.ts"
      - "src/app/**"
      - "src/core/**"
      - "src/modules/**"
      - "tests/**"
      - "supabase/migrations/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/ssot-tests.yml"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tools/seeds/seed-e2e-users.ts"
      - "src/app/**"
      - "src/core/**"
      - "src/modules/**"
      - "tests/**"
      - "supabase/migrations/**"

concurrency:
  group: ssot-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  phase-core-gate:
    name: Phase Core Gate (SSOT)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic phase core gate
        run: npm run validate:phase:core:ci
        env:
          CI: true

  runtime-tests:
    name: Runtime Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SSOT Runtime Tests
        run: npm run test:ssot
        env:
          CI: true

      - name: Record artifact quota policy
        if: always()
        run: echo "Test execution is the gate; artifact upload is diagnostic transport only." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results (non-gating transport)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-tests:
    name: E2E Tests (fixture-backed, remote-only)
    runs-on: ubuntu-latest
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8099
      VITE_PUBLIC_APP_URL: http://127.0.0.1:8099
      VITE_SUPABASE_URL: https://ci-fixtures.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-fixture-key
      VITE_SUPABASE_ANON_KEY: ci-public-fixture-key

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run deterministic public territorial E2E
        run: npm run test:e2e:ci

      - name: Record remote-only test contract
        if: always()
        run: |
          {
            echo "## Remote-only E2E contract"
            echo "The suite uses browser-level public API fixtures and performs no database mutation."
            echo "No local Supabase, Docker, service-role key, or Production seed is required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report (non-gating transport)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results (non-gating transport)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  authenticated_account_e2e:
    name: Authenticated Account + Business E2E (Production smoke)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: https://acheguese.com.br
      E2E_SUPABASE_URL: https://xhdowzacfujckjelqhtd.supabase.co
      E2E_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dc-rd2YjKuZ5KJc_zRYVYA_ANmcFxKk
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Wait for deployed runtime identity
        id: release_identity
        env:
          RELEASE_IDENTITY_URL: https://acheguese.com.br/release.json
          RELEASE_WAIT_TIMEOUT_MS: "600000"
          RELEASE_WAIT_INTERVAL_MS: "5000"
        run: node tools/release/wait-for-production-release.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Account and Business lifecycle E2E
        run: npm run test:e2e:account-authenticated

      - name: Record authenticated fixture contract
        if: always()
        shell: bash
        run: |
          if [ -n "$E2E_USER_EMAIL" ] && [ -n "$E2E_USER_PASSWORD" ]; then
            echo "Authenticated Account + Business lifecycle E2E ran with the dedicated remote fixture." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Authenticated Account E2E was explicitly skipped because fixture credentials are not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Runtime identity mode: ${{ steps.release_identity.outputs.mode }}; deployed SHA: ${{ steps.release_identity.outputs.deployed_sha }}; expected SHA: ${{ steps.release_identity.outputs.expected_sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "This post-merge smoke validates the deployed Production surface against the canonical remote Supabase project." >> "$GITHUB_STEP_SUMMARY"
          echo "Business lifecycle mutations are limited to the dedicated account-authenticated-e2e fixture and cleaned through owner RLS." >> "$GITHUB_STEP_SUMMARY"
          echo "No service-role key is exposed to the browser job." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authenticated E2E report (non-gating transport)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-account-e2e-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  regression-check:
    name: Regression Check
    runs-on: ubuntu-latest
    needs: [runtime-tests, e2e-tests]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run active MVP regression contract
        run: npm run test:mvp:regression
        env:
          CI: true

      - name: Check for URL manual construction
        shell: bash
        run: |
          if grep -r "'/pontos-turisticos/'" src/modules/guide --exclude-dir=__mocks__ --exclude="*.test.ts" --exclude="*.spec.ts"; then
            echo "Found manual URL construction; use buildTouristPointDetailUrl"
            exit 1
          fi

      - name: Check for legacy field usage
        shell: bash
        run: |
          if grep -r "point\.neighborhood" src/modules/guide --exclude-dir=__mocks__ --exclude="*.test.ts" --exclude="*.spec.ts" | grep -v "point\.location?.name ?? point\.neighborhood"; then
            echo "Found direct legacy neighborhood usage"
            exit 1
          fi

      - name: Check for invalid territorial filters
        shell: bash
        run: |
          if grep -r "\.eq('state'" src/modules/guide --exclude-dir=__mocks__ --exclude="*.test.ts" --exclude="*.spec.ts"; then
            echo "Found invalid territorial state filter"
            exit 1
          fi

  status-check:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      [
        phase-core-gate,
        runtime-tests,
        e2e-tests,
        authenticated_account_e2e,
        regression-check,
      ]
    if: always()

    steps:
      - name: Check test results
        shell: bash
        run: |
          if [ "${{ needs.phase-core-gate.result }}" != "success" ] || \
             [ "${{ needs.runtime-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.regression-check.result }}" != "success" ]; then
            echo "One or more pre-merge authoritative test gates failed"
            exit 1
          fi

          if [ "${{ github.event_name }}" != "pull_request" ] && \
             [ "${{ needs.authenticated_account_e2e.result }}" != "success" ]; then
            echo "Production authenticated smoke failed"
            exit 1
          fi

          echo "All authoritative gates for this event passed"
