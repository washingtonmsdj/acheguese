name: Supabase Main DB Push

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-main-db-push.yml"
      - "supabase/migration-lineage-reconciliation.json"
      - "supabase/migrations/**"
      - "tools/ci/verify-supabase-migration-lineage.mjs"
      - "tools/ci/verify-supabase-lineage-reconciliation.mjs"
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character SHA selected from main"
        required: true
        type: string
      apply:
        description: "Apply the exact reconciled pending migration set"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For apply=true, type APPLY_RECONCILED_MAIN_MIGRATIONS"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-main-db-push-production-v5
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SUPABASE_CLI_VERSION: "2.115.0"
  SUPABASE_PROJECT_REF: "xhdowzacfujckjelqhtd"

jobs:
  inspect_production_db:
    name: Read-only migration lineage diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      phase: ${{ steps.phase.outputs.value }}

    steps:
      - name: Validate immutable main target
        id: target
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "washingtonmsdj/acheguese" ]; then
            echo "Unexpected repository: $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            echo "Only refs/heads/main is authorized. Received $EVENT_REF" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          target_sha="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]' | xargs)"
          event_sha="$(printf '%s' "$EVENT_SHA" | tr '[:upper:]' '[:lower:]' | xargs)"
          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$event_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target and event SHA must be exactly 40 hex characters." >&2
            exit 1
          fi
          if [ "$target_sha" != "$event_sha" ]; then
            echo "Requested SHA must equal the exact main SHA selected by Actions. selected=$event_sha requested=$target_sha" >&2
            exit 1
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout isolated Supabase source at exact SHA
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          path: gate
          sparse-checkout: |
            supabase
            tools/ci
          sparse-checkout-cone-mode: true

      - name: Assert checkout provenance
        shell: bash
        working-directory: gate
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "Checkout provenance mismatch. expected=$EXPECTED_SHA actual=$actual" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Isolated worktree must be clean before production DB inspection." >&2
            exit 1
          fi

      - name: Validate required Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Capture migration history through read-only Management API
        id: before_list
        shell: bash
        working-directory: gate
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/acheguese-migration-history-before.json"
          direct_path="$RUNNER_TEMP/acheguese-migration-history-direct.json"
          status="$(
            curl --silent --show-error \
              --output "$direct_path" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Accept: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/migrations"
          )"

          if [ "$status" = "200" ]; then
            cp "$direct_path" "$path"
            source_label="Migrations: Read"
          elif [ "$status" = "403" ]; then
            readonly_path="$RUNNER_TEMP/acheguese-migration-history-readonly-query.json"
            readonly_sql='SELECT version::text AS version FROM supabase_migrations.schema_migrations ORDER BY version'
            readonly_body="$(node -e 'process.stdout.write(JSON.stringify({ query: process.argv[1] }))' "$readonly_sql")"
            readonly_status="$(
              curl --silent --show-error \
                --request POST \
                --output "$readonly_path" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                --header "Accept: application/json" \
                --header "Content-Type: application/json" \
                --data "$readonly_body" \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query/read-only"
            )"
            if [ "$readonly_status" != "201" ]; then
              echo "Supabase read-only database query failed with HTTP $readonly_status after Migrations: Read returned 403." >&2
              if [ "$readonly_status" = "403" ]; then
                echo "SUPABASE_ACCESS_TOKEN requires either Migrations: Read or Database: Read for project $SUPABASE_PROJECT_REF." >&2
              fi
              exit 1
            fi
            node - "$readonly_path" "$path" <<'NODE'
          const fs = require("fs");
          const inputPath = process.argv[2];
          const outputPath = process.argv[3];
          const value = JSON.parse(fs.readFileSync(inputPath, "utf8"));
          const candidates = [
            value,
            value?.data,
            value?.result,
            value?.rows,
            value?.data?.rows,
            value?.result?.rows,
          ];
          const rows = candidates.find(Array.isArray);
          if (!rows) {
            console.error("Read-only query response did not contain a row array.");
            process.exit(2);
          }
          const migrations = rows.map((row) => {
            const rawVersion =
              row && typeof row === "object" && !Array.isArray(row)
                ? row.version
                : Array.isArray(row)
                  ? row[0]
                  : row;
            const version = String(rawVersion ?? "");
            if (!/^\d{14}$/.test(version)) {
              console.error(`Invalid migration version in read-only query response: ${version || "<empty>"}`);
              process.exit(3);
            }
            return { version };
          });
          fs.writeFileSync(outputPath, JSON.stringify(migrations));
          console.log("Read-only query migration entries:", migrations.length);
          NODE
            source_label="Database: Read"
          else
            echo "Supabase Management API migration history request failed with HTTP $status." >&2
            exit 1
          fi

          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const rows=Array.isArray(value)?value:value?.migrations; if(!Array.isArray(rows)) process.exit(2); console.log("Normalized migration entries:", rows.length);' "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "source=$source_label" >> "$GITHUB_OUTPUT"

      - name: Detect exact reconciliation phase
        id: phase
        shell: bash
        working-directory: gate
        env:
          REMOTE_JSON_PATH: ${{ steps.before_list.outputs.path }}
        run: |
          set -euo pipefail
          matched=""
          for candidate in after-push after-repair before; do
            if node tools/ci/verify-supabase-lineage-reconciliation.mjs \
              --remote-json "$REMOTE_JSON_PATH" \
              --directory supabase/migrations \
              --manifest supabase/migration-lineage-reconciliation.json \
              --phase "$candidate"; then
              matched="$candidate"
              break
            fi
          done
          if [ -z "$matched" ]; then
            echo "Remote/local history matches no authorized reconciliation phase." >&2
            exit 1
          fi
          echo "value=$matched" >> "$GITHUB_OUTPUT"
          echo "Authorized reconciliation phase: $matched"

      - name: Record read-only diagnostic summary
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PHASE: ${{ steps.phase.outputs.value }}
          READ_SOURCE: ${{ steps.before_list.outputs.source }}
        run: |
          {
            echo "## Supabase read-only migration diagnostic"
            echo "- Target SHA: $TARGET_SHA"
            echo "- Project ref: $SUPABASE_PROJECT_REF"
            echo "- Read source: $READ_SOURCE"
            echo "- Authorized phase: $PHASE"
            echo "- Runner: GitHub-hosted ubuntu-latest"
            echo "- This job performs no Postgres connection, migration repair, SQL push, seed, reset, or Edge Function deploy."
            echo "- Any production mutation requires an explicit apply dispatch and the restricted mutation runner."
          } >> "$GITHUB_STEP_SUMMARY"

  apply_production_db:
    name: Manual production migration apply
    needs: inspect_production_db
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Validate explicit mutation authority
        id: target
        shell: powershell
        env:
          TARGET_SHA: ${{ needs.inspect_production_db.outputs.target_sha }}
          EVENT_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") { throw "Unexpected repository: $env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_EVENT_NAME -ne "workflow_dispatch") { throw "Production mutation requires workflow_dispatch." }
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Only refs/heads/main is authorized. Received $env:GITHUB_REF" }
          if ($env:CONFIRMATION -ne "APPLY_RECONCILED_MAIN_MIGRATIONS") { throw "Apply mode requires exact confirmation APPLY_RECONCILED_MAIN_MIGRATIONS." }
          $targetSha = ([string]$env:TARGET_SHA).Trim().ToLowerInvariant()
          $eventSha = ([string]$env:EVENT_SHA).Trim().ToLowerInvariant()
          if ($targetSha -notmatch '^[0-9a-f]{40}$' -or $eventSha -notmatch '^[0-9a-f]{40}$') { throw "Target and event SHA must be exactly 40 hex characters." }
          if ($targetSha -ne $eventSha) { throw "Inspection/apply SHA mismatch. inspected=$targetSha event=$eventSha" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$targetSha" -Encoding UTF8

      - name: Checkout isolated Supabase source at exact SHA
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false
          path: gate
          sparse-checkout: |
            supabase
            tools/ci
          sparse-checkout-cone-mode: true

      - name: Assert checkout provenance
        shell: powershell
        working-directory: gate
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Checkout provenance mismatch. expected=$env:EXPECTED_SHA actual=$actual" }
          if (git status --porcelain) { throw "Isolated worktree must be clean before production DB operations." }

      - name: Validate required Supabase credentials
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) { throw "GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing." }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) { throw "GitHub Actions secret SUPABASE_DB_PASSWORD is missing." }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Pin Supabase CLI and link exact project
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $version = (& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne $env:SUPABASE_CLI_VERSION) { throw "Unexpected Supabase CLI version: $version" }
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" link --project-ref $env:SUPABASE_PROJECT_REF --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $linkedRef = (Get-Content "supabase/.temp/project-ref" -Raw).Trim()
          if ($linkedRef -ne $env:SUPABASE_PROJECT_REF) { throw "Linked Supabase project mismatch: $linkedRef" }

      - name: Recapture migration history before mutation
        id: before_list
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $output = @(& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" migration list --linked --password $env:SUPABASE_DB_PASSWORD 2>&1)
          if ($LASTEXITCODE -ne 0) { $output | ForEach-Object { Write-Host $_ }; throw "supabase migration list failed." }
          $path = Join-Path $env:RUNNER_TEMP "acheguese-migration-list-apply-before.txt"
          Set-Content -Path $path -Value ($output -join [Environment]::NewLine) -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$path" -Encoding UTF8

      - name: Revalidate exact reconciliation phase
        id: phase
        shell: powershell
        working-directory: gate
        env:
          LIST_PATH: ${{ steps.before_list.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"
          $matched = $null
          foreach ($candidate in @("after-push", "after-repair", "before")) {
            & node "tools/ci/verify-supabase-lineage-reconciliation.mjs" --list $env:LIST_PATH --directory "supabase/migrations" --manifest "supabase/migration-lineage-reconciliation.json" --phase $candidate
            if ($LASTEXITCODE -eq 0) { $matched = $candidate; break }
          }
          if ([string]::IsNullOrWhiteSpace($matched)) { throw "Remote/local history matches no authorized reconciliation phase." }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "value=$matched" -Encoding UTF8
          Write-Host "Fresh authorized reconciliation phase: $matched"

      - name: Repair tracking for proven historical aliases and retired no-op slots
        if: ${{ steps.phase.outputs.value == 'before' }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content "supabase/migration-lineage-reconciliation.json" -Raw | ConvertFrom-Json
          $versions = @($manifest.repairAppliedVersions)
          if ($versions.Count -ne 26) { throw "Expected exactly 26 tracking versions to repair, received $($versions.Count)." }
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" migration repair @versions --status applied --linked --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "Migration tracking repair failed. No SQL push attempted." }

      - name: Verify exact post-repair state
        if: ${{ steps.phase.outputs.value != 'after-push' }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $output = @(& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" migration list --linked --password $env:SUPABASE_DB_PASSWORD 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Post-repair migration list failed." }
          $path = Join-Path $env:RUNNER_TEMP "acheguese-migration-list-after-repair.txt"
          Set-Content -Path $path -Value ($output -join [Environment]::NewLine) -Encoding UTF8
          & node "tools/ci/verify-supabase-lineage-reconciliation.mjs" --list $path --directory "supabase/migrations" --manifest "supabase/migration-lineage-reconciliation.json" --phase "after-repair"
          if ($LASTEXITCODE -ne 0) { throw "Tracking state is not the authorized after-repair phase. No SQL push attempted." }

      - name: Dry-run exact forward migration set
        if: ${{ steps.phase.outputs.value != 'after-push' }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" db push --linked --dry-run --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply exact forward migration set
        if: ${{ steps.phase.outputs.value != 'after-push' }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" db push --linked --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify migration history fully synchronized
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $output = @(& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" migration list --linked --password $env:SUPABASE_DB_PASSWORD 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Final migration list failed." }
          $path = Join-Path $env:RUNNER_TEMP "acheguese-migration-list-final.txt"
          Set-Content -Path $path -Value ($output -join [Environment]::NewLine) -Encoding UTF8
          & node "tools/ci/verify-supabase-lineage-reconciliation.mjs" --list $path --directory "supabase/migrations" --manifest "supabase/migration-lineage-reconciliation.json" --phase "after-push"
          if ($LASTEXITCODE -ne 0) { throw "Reconciliation did not finish synchronized." }
          & node "tools/ci/verify-supabase-migration-lineage.mjs" --list $path --directory "supabase/migrations" --expected "none"
          if ($LASTEXITCODE -ne 0) { throw "Canonical lineage gate disagrees after reconciliation." }

      - name: Lint remote database
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" db lint --linked --level error --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy profile-rpc from exact reconciled SHA
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" functions deploy profile-rpc --project-ref $env:SUPABASE_PROJECT_REF --use-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify deployed profile-rpc authority
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $raw = (& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" functions list --project-ref $env:SUPABASE_PROJECT_REF --output json) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw "Supabase functions list failed." }
          $entries = $raw | ConvertFrom-Json
          $profileRpc = @($entries | Where-Object { $_.slug -eq "profile-rpc" -or $_.name -eq "profile-rpc" })
          if ($profileRpc.Count -ne 1) { throw "Expected exactly one deployed profile-rpc, found $($profileRpc.Count)." }
          $entry = $profileRpc[0]
          if ([string]$entry.status -ne "ACTIVE") { throw "profile-rpc is not ACTIVE: $($entry.status)" }
          $verifyJwt = if ($null -ne $entry.verify_jwt) { [bool]$entry.verify_jwt } else { [bool]$entry.verifyJwt }
          if (-not $verifyJwt) { throw "profile-rpc must remain verify_jwt=true." }
          Write-Host "profile-rpc ACTIVE with verify_jwt=true; version=$($entry.version)"

      - name: Record mutation gate summary
        if: always()
        shell: powershell
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PHASE: ${{ steps.phase.outputs.value }}
        run: |
          @(
            "## Supabase manual production migration apply",
            "- Target SHA: $env:TARGET_SHA",
            "- Project ref: $env:SUPABASE_PROJECT_REF",
            "- Supabase CLI: $env:SUPABASE_CLI_VERSION",
            "- Fresh initial authorized phase: $env:PHASE",
            "- Mutation authority: explicit workflow_dispatch + exact confirmation",
            "- Runner: restricted self-hosted Windows",
            "- Remote historical versions are preserved; none are reverted.",
            "- Tracking repair may only mark the 26 manifest versions applied.",
            "- SQL apply is allowed only after exact after-repair verification and dry-run.",
            "- Destructive database recreation, historical-inclusive push, seed, fallback mutation or unversioned DDL is not permitted."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
