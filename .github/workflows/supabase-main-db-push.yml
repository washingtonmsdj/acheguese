name: Supabase Main DB Push

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-main-db-push.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character SHA selected from main"
        required: true
        type: string
      apply:
        description: "Apply the five approved LGPD migrations and deploy privacy-rpc"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For apply=true, type APPLY_5_LGPD_MIGRATIONS"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-main-db-push-production-v3
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SUPABASE_CLI_VERSION: "2.115.0"
  SUPABASE_PROJECT_REF: "xhdowzacfujckjelqhtd"

jobs:
  push-production-db:
    name: Main-only production migration gate
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Validate immutable main target
        id: target
        shell: powershell
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
          APPLY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}
          CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REPOSITORY -ne "washingtonmsdj/acheguese") {
            throw "Unexpected repository: $env:GITHUB_REPOSITORY"
          }
          if ($env:EVENT_REF -ne "refs/heads/main") {
            throw "Only refs/heads/main is authorized. Received $env:EVENT_REF"
          }
          if ($env:GITHUB_EVENT_NAME -ne "push" -and $env:GITHUB_EVENT_NAME -ne "workflow_dispatch") {
            throw "Unsupported event: $env:GITHUB_EVENT_NAME"
          }

          $targetSha = ([string]$env:TARGET_SHA).Trim().ToLowerInvariant()
          $eventSha = ([string]$env:EVENT_SHA).Trim().ToLowerInvariant()
          if ($targetSha -notmatch '^[0-9a-f]{40}$') {
            throw "Target SHA must be exactly 40 hex characters."
          }
          if ($eventSha -notmatch '^[0-9a-f]{40}$') {
            throw "Actions event SHA is invalid."
          }
          if ($targetSha -ne $eventSha) {
            throw "Requested SHA must equal the exact main SHA selected by Actions. selected=$eventSha requested=$targetSha"
          }

          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:APPLY_REQUESTED -eq "true") {
            throw "Push-triggered runs are dry-run only."
          }
          if ($env:APPLY_REQUESTED -eq "true" -and $env:CONFIRMATION -ne "APPLY_5_LGPD_MIGRATIONS") {
            throw "Apply mode requires exact confirmation APPLY_5_LGPD_MIGRATIONS."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$targetSha" -Encoding UTF8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "apply=$($env:APPLY_REQUESTED.ToLowerInvariant())" -Encoding UTF8
          Write-Host "Exact main SHA accepted: $targetSha"
          Write-Host "Apply requested: $env:APPLY_REQUESTED"

      - name: Checkout isolated Supabase source at exact SHA
        uses: actions/checkout@v6
        with:
          repository: washingtonmsdj/acheguese
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false
          path: gate
          sparse-checkout: |
            supabase
          sparse-checkout-cone-mode: true

      - name: Assert checkout provenance
        shell: powershell
        working-directory: gate
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Checkout provenance mismatch. expected=$env:EXPECTED_SHA actual=$actual"
          }
          if (git status --porcelain) {
            throw "Isolated worktree must be clean before production DB operations."
          }

      - name: Validate required Supabase credentials
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            throw "GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) {
            throw "GitHub Actions secret SUPABASE_DB_PASSWORD is missing."
          }
          Write-Host "Required Supabase credentials are present."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Pin Supabase CLI and link exact project
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $version = (& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ne $env:SUPABASE_CLI_VERSION) {
            throw "Unexpected Supabase CLI version: $version"
          }

          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" link --project-ref $env:SUPABASE_PROJECT_REF --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $linkedRef = (Get-Content "supabase/.temp/project-ref" -Raw).Trim()
          if ($linkedRef -ne $env:SUPABASE_PROJECT_REF) {
            throw "Linked Supabase project mismatch: $linkedRef"
          }

      - name: Prove migration history delta is exactly approved
        id: migrations
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            "20260821001800",
            "20260821002600",
            "20260821011000",
            "20260821022500",
            "20260821024000"
          )

          $migrationOutput = @(& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" migration list --linked --password $env:SUPABASE_DB_PASSWORD 2>&1)
          if ($LASTEXITCODE -ne 0) {
            $migrationOutput | ForEach-Object { Write-Host $_ }
            throw "supabase migration list failed."
          }
          $migrationOutput | ForEach-Object { Write-Host $_ }

          $localOnly = New-Object System.Collections.Generic.List[string]
          $remoteOnly = New-Object System.Collections.Generic.List[string]

          foreach ($line in $migrationOutput) {
            $text = [string]$line
            $parts = @([regex]::Split($text, '\s*[|│]\s*'))
            if ($parts.Count -lt 2) { continue }

            $localMatch = [regex]::Match($parts[0], '\d{14}')
            $remoteMatch = [regex]::Match($parts[1], '\d{14}')

            if ($localMatch.Success -and -not $remoteMatch.Success) {
              $localOnly.Add($localMatch.Value)
            } elseif (-not $localMatch.Success -and $remoteMatch.Success) {
              $remoteOnly.Add($remoteMatch.Value)
            }
          }

          $localOnly = @($localOnly | Sort-Object -Unique)
          $remoteOnly = @($remoteOnly | Sort-Object -Unique)

          if ($remoteOnly.Count -ne 0) {
            throw "Remote-only migrations detected: $($remoteOnly -join ', ')"
          }

          $delta = @(Compare-Object -ReferenceObject $expected -DifferenceObject $localOnly)
          if ($delta.Count -ne 0) {
            throw "Pending migration set differs from approved five. Expected=$($expected -join ',') Actual=$($localOnly -join ',')"
          }

          $localFiles = @(
            Get-ChildItem "supabase/migrations" -File -Filter "*.sql" |
              ForEach-Object { if ($_.BaseName -match '^(\d{14})_') { $Matches[1] } } |
              Where-Object { $_ -in $expected } |
              Sort-Object -Unique
          )
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $localFiles).Count -ne 0) {
            throw "One or more approved migration files are missing from the exact checkout."
          }

          Write-Host "Approved pending migrations: $($localOnly -join ', ')"

      - name: Dry-run production DB push
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" db push --linked --dry-run --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply approved migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" db push --linked --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify migration history fully synchronized
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          $migrationOutput = @(& npx --yes "supabase@$env:SUPABASE_CLI_VERSION" migration list --linked --password $env:SUPABASE_DB_PASSWORD 2>&1)
          if ($LASTEXITCODE -ne 0) {
            $migrationOutput | ForEach-Object { Write-Host $_ }
            throw "Post-push migration list failed."
          }
          $migrationOutput | ForEach-Object { Write-Host $_ }

          $mismatches = New-Object System.Collections.Generic.List[string]
          foreach ($line in $migrationOutput) {
            $text = [string]$line
            $parts = @([regex]::Split($text, '\s*[|│]\s*'))
            if ($parts.Count -lt 2) { continue }
            $localMatch = [regex]::Match($parts[0], '\d{14}')
            $remoteMatch = [regex]::Match($parts[1], '\d{14}')
            if ($localMatch.Success -xor $remoteMatch.Success) {
              $mismatches.Add($text.Trim())
            } elseif ($localMatch.Success -and $remoteMatch.Success -and $localMatch.Value -ne $remoteMatch.Value) {
              $mismatches.Add($text.Trim())
            }
          }

          if ($mismatches.Count -ne 0) {
            throw "Migration history is not synchronized after push: $($mismatches -join ' | ')"
          }
          Write-Host "Local and remote migration histories are synchronized."

      - name: Lint remote database
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" db lint --linked --level error --password $env:SUPABASE_DB_PASSWORD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy privacy-rpc from exact SHA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        shell: powershell
        working-directory: gate
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes "supabase@$env:SUPABASE_CLI_VERSION" functions deploy privacy-rpc --project-ref $env:SUPABASE_PROJECT_REF --use-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record gate summary
        if: always()
        shell: powershell
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          APPLY_REQUESTED: ${{ steps.target.outputs.apply }}
        run: |
          @(
            "## Supabase production migration gate",
            "- Repository: washingtonmsdj/acheguese",
            "- Event: $env:GITHUB_EVENT_NAME",
            "- Target SHA: $env:TARGET_SHA",
            "- Branch authority: main only",
            "- Project ref: $env:SUPABASE_PROJECT_REF",
            "- Supabase CLI: $env:SUPABASE_CLI_VERSION",
            "- Apply requested: $env:APPLY_REQUESTED",
            "- Approved versions: 20260821001800, 20260821002600, 20260821011000, 20260821022500, 20260821024000",
            "- Push-triggered executions are always dry-run only.",
            "- Checkout is isolated under gate/ to avoid shared self-hosted workspace cleanup locks.",
            "- No seed, reset, repair, branch creation, or destructive fallback is permitted by this workflow."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
