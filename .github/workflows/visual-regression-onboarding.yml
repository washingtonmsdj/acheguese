name: Visual Regression - Onboarding

on:
  pull_request:
    paths:
      - 'src/app/pages/OnboardingPage.tsx'
      - 'src/**/onboarding/**'
      - 'tests/e2e/onboarding-visual-regression*.spec.ts'
      - 'tests/e2e/onboarding-visual-regression*.spec.ts-snapshots/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-regression-onboarding.yml'
  workflow_dispatch:

concurrency:
  group: visual-regression-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Onboarding visual regression (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet, desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression (${{ matrix.viewport }})
        env:
          CI: 'true'
        run: npx playwright test onboarding-visual-regression-${{ matrix.viewport == 'mobile' && '' || matrix.viewport }} --project=chromium
        # Note: mobile spec has no suffix in filename
        continue-on-error: false

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
