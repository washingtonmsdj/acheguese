name: Refresh Secure Dependency Lock

on:
  push:
    branches:
      - fix/mvp-keep-search-active
    paths:
      - ".github/workflows/refresh-secure-dependency-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-secure-dependency-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mvp-keep-search-active
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify high and critical audit gate
        run: npm audit --audit-level=high

      - name: Commit deterministic lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh secure dependency lock"
          git push origin HEAD:fix/mvp-keep-search-active
