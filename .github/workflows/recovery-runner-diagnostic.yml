name: Recovery Runner Diagnostic (Temporary)

on:
  push:
    branches:
      - ops/recovery-refresh-20260818

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  diagnose:
    name: Inspect recovery prerequisites
    if: github.event.head_commit.message != 'ops: record recovery diagnostic result'
    runs-on:
      - self-hosted
      - windows
      - x64
      - acheguese-heavy-windows
      - remote-only
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Inspect and write safe diagnostic result
        shell: powershell
        env:
          GH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GH_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $commands = @{}
          foreach ($name in @("supabase", "pg_dump", "psql", "node", "npx", "tar", "7z")) {
            $commands[$name] = [bool](Get-Command $name -ErrorAction SilentlyContinue)
          }

          $machineEnv = @{}
          foreach ($name in @("SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_DB_PASSWORD", "SUPABASE_ACCESS_TOKEN", "SUPABASE_DB_URL")) {
            $machineEnv[$name] = (
              -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name, "Process")) -or
              -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name, "User")) -or
              -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name, "Machine"))
            )
          }

          $snapshot = "20260815T201851Z"
          $candidateBases = [System.Collections.Generic.List[string]]::new()
          $candidateBases.Add($env:USERPROFILE)
          foreach ($drive in Get-PSDrive -PSProvider FileSystem) {
            foreach ($suffix in @("", "My Drive", "Google Drive", "Meu Drive")) {
              $candidateBases.Add((Join-Path $drive.Root $suffix))
            }
          }
          foreach ($suffix in @("My Drive", "Google Drive", "Meu Drive", "Google Drive Streaming")) {
            $candidateBases.Add((Join-Path $env:USERPROFILE $suffix))
          }

          $visited = New-Object 'System.Collections.Generic.HashSet[string]'
          function Find-SnapshotLimited([string]$base, [int]$maxDepth) {
            if (-not (Test-Path -LiteralPath $base -PathType Container)) { return $null }
            $queue = New-Object System.Collections.Queue
            $queue.Enqueue(@($base, 0))
            while ($queue.Count -gt 0) {
              $item = $queue.Dequeue()
              $path = [string]$item[0]
              $depth = [int]$item[1]
              if ($visited.Contains($path)) { continue }
              [void]$visited.Add($path)
              if ((Split-Path -Leaf $path) -eq $snapshot) { return $path }
              if ($depth -ge $maxDepth) { continue }
              try {
                foreach ($dir in Get-ChildItem -LiteralPath $path -Directory -Force -ErrorAction SilentlyContinue) {
                  if ($dir.Name -in @("node_modules", ".git", "Windows", "Program Files", "Program Files (x86)", "$Recycle.Bin")) { continue }
                  $queue.Enqueue(@($dir.FullName, $depth + 1))
                }
              } catch {}
            }
            return $null
          }

          $found = $null
          foreach ($base in ($candidateBases | Select-Object -Unique)) {
            $found = Find-SnapshotLimited $base 6
            if ($found) { break }
          }

          $priorFileCount = 0
          $priorTotalBytes = 0
          $priorNames = @()
          if ($found) {
            $files = @(Get-ChildItem -LiteralPath $found -Recurse -File -ErrorAction SilentlyContinue)
            $priorFileCount = $files.Count
            $sum = ($files | Measure-Object Length -Sum).Sum
            if ($null -ne $sum) { $priorTotalBytes = [int64]$sum }
            $priorNames = @($files | Select-Object -ExpandProperty Name | Sort-Object -Unique)
          }

          $result = [ordered]@{
            schema = "acheguese-recovery-runner-diagnostic/v1"
            sourceSha = (git rev-parse HEAD).Trim()
            priorSnapshotId = $snapshot
            priorSnapshotFound = [bool]$found
            priorSnapshotFileCount = $priorFileCount
            priorSnapshotTotalBytes = $priorTotalBytes
            priorSnapshotFileNames = $priorNames
            tools = $commands
            repositorySecrets = [ordered]@{
              SUPABASE_SERVICE_ROLE_KEY = -not [string]::IsNullOrWhiteSpace($env:GH_SUPABASE_SERVICE_ROLE_KEY)
              SUPABASE_DB_PASSWORD = -not [string]::IsNullOrWhiteSpace($env:GH_SUPABASE_DB_PASSWORD)
              SUPABASE_ACCESS_TOKEN = -not [string]::IsNullOrWhiteSpace($env:GH_SUPABASE_ACCESS_TOKEN)
              SUPABASE_DB_URL = -not [string]::IsNullOrWhiteSpace($env:GH_SUPABASE_DB_URL)
            }
            machineEnvironment = $machineEnv
          }

          New-Item -ItemType Directory -Force -Path ".ops" | Out-Null
          $result | ConvertTo-Json -Depth 8 | Set-Content -Path ".ops/recovery-prereq-result.json" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ops/recovery-prereq-result.json
          git commit -m "ops: record recovery diagnostic result"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No diagnostic result change to commit."
            exit 0
          }
          git push origin HEAD:ops/recovery-refresh-20260818
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
