project_id = "xhdowzacfujckjelqhtd"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv6"
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
# Requer plano Pro — desabilitado no free tier
enabled = false

[storage.vector]
# Recurso alpha sem uso no produto e indisponível no plano remoto atual.
enabled = false

[auth]
enabled = true
site_url = "https://acheguese.com.br"
additional_redirect_urls = ["https://acheguese.com.br", "https://acheguese.com.br/aceitar-termos", "https://acheguese.vercel.app", "https://acheguese.vercel.app/aceitar-termos", "http://localhost:8080", "http://localhost:8080/aceitar-termos", "http://localhost:5173", "http://localhost:5173/aceitar-termos", "http://127.0.0.1:5174/aceitar-termos"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[auth.sessions]
# timebox e inactivity_timeout requerem plano Pro — gerenciar via Dashboard

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

