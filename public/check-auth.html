<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Auth</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Verificacao de Autenticacao</h1>

  <p>Informe URL e anon key do projeto atual. Nao deixe secrets hardcoded neste arquivo.</p>

  <label>
    Supabase URL
    <input id="supabase-url" type="text" placeholder="https://seu-projeto.supabase.co" style="width: 420px;" />
  </label>
  <br /><br />

  <label>
    Supabase Anon Key
    <input id="supabase-anon-key" type="text" placeholder="sb_publishable_..." style="width: 420px;" />
  </label>
  <br /><br />

  <button id="run-check" type="button">Executar verificacao</button>

  <div id="result" style="margin-top: 16px;"></div>

  <script>
    async function check() {
      const result = document.getElementById('result');
      const supabaseUrl = document.getElementById('supabase-url').value.trim();
      const supabaseAnonKey = document.getElementById('supabase-anon-key').value.trim();

      if (!supabaseUrl || !supabaseAnonKey) {
        result.innerHTML = '<p style="color: red;">Preencha Supabase URL e Anon Key.</p>';
        return;
      }

      const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

      const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        result.innerHTML = '<p style="color: red;">Nao esta logado</p>';
        return;
      }

      result.innerHTML = `<p style="color: green;">Logado como: ${user.email}</p>`;
      result.innerHTML += `<p>User ID: ${user.id}</p>`;

      const { data: roles, error: rolesError } = await supabaseClient
        .from('user_roles')
        .select('*')
        .eq('user_id', user.id);

      if (rolesError) {
        result.innerHTML += `<p style="color: red;">Erro ao buscar roles: ${rolesError.message}</p>`;
      } else {
        result.innerHTML += `<p>Roles: <pre>${JSON.stringify(roles, null, 2)}</pre></p>`;
      }
    }

    document.getElementById('run-check').addEventListener('click', () => {
      check().catch((err) => {
        document.getElementById('result').innerHTML = `<p style="color: red;">Erro: ${err.message}</p>`;
      });
    });
  </script>
</body>
</html>
