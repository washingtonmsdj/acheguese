# Gitleaks configuration for detecting secrets
# https://github.com/gitleaks/gitleaks

title = "Gitleaks Config - Supabase Project"

[extend]
useDefault = true

[[rules]]
id = "supabase-service-role-key-jwt"
description = "Supabase Service Role Key (formato JWT legado)"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ii4{20,}Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSI'''
tags = ["key", "supabase", "critical"]

[[rules]]
id = "supabase-secret-key-new"
description = "Supabase Secret Key (novo formato sb_secret_...)"
regex = '''sb_secret_[A-Za-z0-9_\-]{20,}'''
tags = ["key", "supabase", "critical"]

[[rules]]
id = "supabase-publishable-key-new"
description = "Supabase Publishable Key (novo formato sb_publishable_...)"
regex = '''sb_publishable_[A-Za-z0-9_\-]{20,}'''
tags = ["key", "supabase", "medium"]

[[rules]]
id = "postgresql-connection-string"
description = "PostgreSQL connection string with password"
regex = '''postgresql://[^:]+:[^@]+@[^/]+'''
tags = ["database", "connection-string", "critical"]

[[rules]]
id = "supabase-anon-key-hardcoded"
description = "Supabase Anon Key hardcoded em scripts (formato JWT legado)"
regex = '''(const|let|var)\s+\w+\s*=\s*['"]eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ii4{20,}Iiwicm9sZSI6ImFub24i'''
tags = ["key", "supabase", "medium"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
tags = ["key", "api"]

[allowlist]
description = "Allowlist for false positives"
paths = [
    '''^\.env\.example$''',
    '''^\.env\.remote\.example$''',
    '''^\.env\.local\.example$''',
    '''\.md$''',
    '''gitleaks\.toml$''',
    '''scripts/security/validate-security\.mjs$''',
]

regexes = [
    '''your_.*_key_here''',
    '''\[YOUR.*\]''',
    '''\[PASSWORD\]''',
    '''example\.com''',
    '''PROJECT_REF''',
    # Placeholders explícitos nos arquivos de exemplo
    '''sb_publishable_your''',
    '''sb_secret_your''',
]
